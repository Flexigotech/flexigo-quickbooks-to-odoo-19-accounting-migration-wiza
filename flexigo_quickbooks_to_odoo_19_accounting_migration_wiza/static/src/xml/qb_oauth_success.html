<?xml version="1.0" encoding="UTF-8"?>
<templates xml:space="preserve">
    <t t-name="qb_oauth_success">
        <t t-call="website.layout">
            <div class="container mt-5">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <h3 class="alert-heading">QuickBooks Connected Successfully</h3>
                            <p>Your QuickBooks Online account has been successfully connected!</p>
                            <hr/>
                            <p>You will be redirected shortly to continue the migration process.</p>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    </div>
                </div>
            </div>
        </t>
    </t>
</templates>
